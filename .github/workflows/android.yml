name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "KEYSTORE_BASE64 is empty. The release APK will be signed with the debug key."
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '\r\n \t' | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"
          wc -c "${RUNNER_TEMP}/release.keystore"

      - name: Lint, test, and assemble release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lint test assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          echo "APK=${APK}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS="$(find "${SDK}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Build tools: ${BUILD_TOOLS}"
          "${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}" | tee /tmp/apk-certs.txt
          NORM="$(grep -i 'SHA-256' /tmp/apk-certs.txt | head -n 1 | sed 's/.*: //' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          echo "Normalized SHA-256: ${NORM}"
          EXPECTED="3FEF3B69230C1696C4FC164F732D563E1BB96F8270D3FDFD50AB359CF1025E44"
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            if [ "${NORM}" != "${EXPECTED}" ]; then
              echo "Release certificate does not match the expected release key."
              exit 1
            fi
            echo "Release APK is signed with the expected release key."
          else
            echo "KEYSTORE_FILE is unset, so the certificate was not checked against the release key."
          fi

      - name: Upload APK artifact
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fold-usage-tracker
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          cp "${APK}" "fold-usage-tracker-v${VERSION}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fold-usage-tracker-v*.apk
          generate_release_notes: true
